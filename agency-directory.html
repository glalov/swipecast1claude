         distance after the logo appears no matter when the first frame landed.
         The t0 backstop covers the 400ms fallback path below, and the `flashed`
         guard means whichever fires first wins. It is a no-op once the curtain
         has gone, so a fast boot can never flash into an empty screen. */

      }
      raf(function(){raf(csReady);});
      setTimeout(csReady,400);
      setTimeout(csFlash,1060);

         played (logo rise, cube spin, flash, then a 500ms beat on the flare -
         MIN below, 1940ms; this comment used to say 2.9s, from before the
         July halving) AND the app behind it has
         actually painted. On a slow connection the logo simply keeps
         breathing until the site is ready, so the reveal always lands on
         a live page — never on a loading spinner or a half-built layout.
         Hard 15s cap so a failed boot can never trap the curtain. */
      /* MIN holds the flare on screen for half a second before the curtain
         moves. The flash is armed at ready+1000ms (t0 backstop 1060ms) and
         runs .38s, so its latest possible finish is 1440ms; 1940 puts a clean
         500ms beat after it on every path. Raising or lowering this is the ONLY
         thing that changes that pause - the effect's own timing is independent.
         2330 = 1060 (latest start) + 770 + 500, where 770 is whichever of the
         two finishes last: the cube's 700ms turn, or the hairline, which starts
         220ms in and runs 550ms. Was 2260 with a 400ms hairline (it ended inside
         the turn and cost nothing), 1940 when the effect was a 380ms flash, and
         1450 before that with no beat at all. */

         having run, an event having fired, or an earlier timer having
         survived - it is the floor under every path below. */
      var watch=0;
      function kill(){
        gone=true;
        if(watch){clearInterval(watch);watch=0;}
        if(el&&el.parentNode)el.parentNode.removeChild(el);
        csIntroDone();
      }
      function go(){
        if(gone)return;
        gone=true;goAt=Date.now();
        el.classList.add('cs-go');
        /* 550ms is the curtain's own fall duration (cs-bg-down), so this is
           the frame it is actually clear - not when the node is removed. */
        setTimeout(csIntroDone,550);
        setTimeout(kill,700);
        /* The fall is a CSS animation, and CSS animations do not advance
           while the tab is hidden - so a curtain that started dropping in a
           background tab would still be solid black on return. Wall-clock
           belt and braces: the node is gone by then either way. */
        setTimeout(kill,1600);
      }
      /* Wall-clock watchdogs. The poll below re-arms itself with setTimeout;
         if any single timer is dropped or clamped (hidden tab, throttled
         mobile Safari) the chain would stop and the black curtain would stay
         on screen forever. These two do not re-arm and cannot be starved. */
      watch=setInterval(function(){ if(Date.now()-t0<CAP)return; if(gone)kill(); else go(); },500);
      setTimeout(kill,CAP+2000);
      document.addEventListener('visibilitychange',function(){
        if(document.visibilityState!=='visible')return;
        var e=Date.now()-t0;
        /* Fall already begun but frozen while hidden - if its 550ms is long
           past in wall-clock terms, take the node out rather than resume. */
        if(gone){ if(Date.now()-goAt>=700)kill(); }
        else if(e>=MIN&&appReady())go();
      });
      (function poll(){
        if(gone)return;
        var e=Date.now()-t0;
        if((e>=MIN&&appReady())||e>=CAP){go();return;}
        setTimeout(poll,120);
      })();
    })();

    /* ── Runtime error infrastructure ────────────────────────────────────────
       The crash screen means "the app did NOT start" — NOT merely "an error
       fired." A single stray error (browser extension, injected assistant
       script, a cross-origin "Script error.", a benign ResizeObserver loop)
       must never blank an app that was about to render fine. So error handlers
       only LOG; a polling verify-mount check is the ONLY thing that shows the
       crash screen, and only when React genuinely rendered nothing in time.
       Errors AFTER React mounts are caught per-section by ErrorBoundary.
    ──────────────────────────────────────────────────────────────────────── */
    window.__CS_LOADING_STARTED = Date.now();
    window.__CS_REACT_MOUNTED   = false;
    window.__SC_ERR             = [];
    window.__CS_PRE_COMPILED    = true;

    window.__CS_HIDE_LOADING = function(){
      var el = document.getElementById('cs-loading');
      if(el){ el.classList.add('hide'); setTimeout(function(){el.style.display='none';},350); }
    };

    var showDebug = (window.location.search||'').indexOf('debug')!==-1;

    function csShowCrash(msg){
      var ld=document.getElementById('cs-loading'); if(ld) ld.style.display='none';
      var er=document.getElementById('cs-error');   if(er) er.style.display='flex';
      if(showDebug && msg){
        var d=document.getElementById('cs-err-detail');
        if(d){d.style.display='block';d.textContent=msg;}
      }
    }

    /* Noise we never count as a real failure (browser/extension chatter). */
    function csIsBenign(msg){ return /ResizeObserver loop|^Script error\.?$/i.test(msg||''); }

    /* Log uncaught errors for diagnostics only — do NOT show the crash screen
       here. The verify-mount poll below decides whether the app truly failed. */
    window.addEventListener('error', function(e){
      var msg = (e.message||'unknown') + '\n' + (e.filename||'?') + ':' + (e.lineno||0);
      if(!csIsBenign(e.message)) window.__SC_ERR.push({type:'error', msg:msg, ts:new Date().toISOString()});
      console.error('[CS error]', msg);
    });
    window.addEventListener('unhandledrejection', function(e){
      var msg = (e.reason && e.reason.message) ? e.reason.message : String(e.reason||'unknown rejection');
      window.__SC_ERR.push({type:'rejection', msg:msg, ts:new Date().toISOString()});
      console.error('[CS unhandled rejection]', msg);
    });

    /* Verify-mount — the ONLY path to the crash screen. Poll until React mounts
       (flag set by App's first effect, or #root has painted children). Show the
       crash UI only if nothing rendered within the grace window — a genuine
       startup failure, never a stray error on an otherwise-healthy load.
       30s grace is generous for slow mobile networks; a fast boot clears it
       within a couple hundred ms. */
    (function(){
      var DEADLINE = Date.now() + 30000;
      (function poll(){
        if(window.__CS_REACT_MOUNTED) return;
        var root=document.getElementById('root');
        if(root && root.childElementCount>0){ window.__CS_REACT_MOUNTED=true; return; }
        if(Date.now()>=DEADLINE){
          var elapsed=Math.round((Date.now()-window.__CS_LOADING_STARTED)/1000);
          var errList=window.__SC_ERR.map(function(e){return e.msg;}).join('\n');
          csShowCrash('App did not start within '+elapsed+'s.\n'+(errList||'No JS errors captured — likely a network issue.'));
          return;
        }
        setTimeout(poll, 400);
      })();
    })();
